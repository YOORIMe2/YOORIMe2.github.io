<style>
:root{--bg:#080B12;--navy:#101B30;--blue:#1264F5;--ice:#EAF1FF;--mute:#8E9BB0;--line:rgba(234,241,255,.14);--line2:rgba(234,241,255,.28);--wbg:#FFFFFF;--wtx:#17191D;
--disp:"Manrope","Pretendard","Noto Sans KR",system-ui,sans-serif;--body:"Inter","Pretendard","Noto Sans KR",system-ui,sans-serif;--mono:"Inter","Pretendard","Noto Sans KR",system-ui,sans-serif;--ko:"Pretendard","Noto Sans KR",sans-serif;--g:clamp(16px,4vw,56px);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ice);font:400 16px/1.7 var(--body);word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.skip{position:absolute;left:-999px;top:8px;background:var(--blue);color:#fff;padding:8px 14px;z-index:200}.skip:focus{left:8px}
.wrap{padding-inline:var(--g);max-width:1680px;margin-inline:auto}
.lab{font:500 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}

.rv{opacity:0;transform:translateY(28px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

/* header */

.logo-h img{height:26px;width:auto}
nav.main{display:flex;gap:clamp(20px,3vw,44px)}
nav.main a{font:600 13px/1 var(--body);letter-spacing:.1em;padding:8px 0;position:relative;color:var(--ice)}
nav.main a::after{content:"";position:absolute;left:0;bottom:2px;height:1px;width:0;background:var(--blue);transition:width .3s}
nav.main a:hover::after,nav.main a.on::after{width:100%}
.burger{display:none;width:44px;height:44px;position:relative}
.burger i{position:absolute;left:10px;right:10px;height:2px;background:var(--ice);transition:.3s}.burger i:nth-child(1){top:16px}.burger i:nth-child(2){top:26px}
.burger[aria-expanded=true] i:nth-child(1){top:21px;transform:rotate(45deg)}.burger[aria-expanded=true] i:nth-child(2){top:21px;transform:rotate(-45deg)}
@media(max-width:760px){.burger{display:block}
 nav.main{position:fixed;inset:0;background:var(--bg);flex-direction:column;justify-content:center;gap:26px;padding:var(--g);transform:translateY(-100%);transition:transform .45s cubic-bezier(.7,0,.2,1);visibility:hidden}
 nav.main.open{transform:none;visibility:visible}
 nav.main a{font:800 clamp(36px,12vw,56px)/1 var(--disp);letter-spacing:-.02em}
 header.top{z-index:110}.logo-h,.burger{position:relative;z-index:120}}
/* hero */
.hero{min-height:100svh;position:relative;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;padding-block:130px 40px;isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(90px);will-change:transform}
.hero::before{width:62vmax;height:62vmax;left:-12vmax;top:-18vmax;background:radial-gradient(circle,rgba(18,100,245,.55),transparent 62%);animation:drift1 28s ease-in-out infinite alternate}
.hero::after{width:48vmax;height:48vmax;right:-14vmax;bottom:-20vmax;background:radial-gradient(circle,rgba(16,27,48,1),transparent 65%);animation:drift2 34s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,10vmax)}}@keyframes drift2{to{transform:translate(-20vmax,-8vmax)}}
.hero-grid{position:absolute;inset:0;z-index:-1;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(100%/12) 100%,100% 120px;opacity:.28;mask-image:linear-gradient(#000,transparent 85%)}
.hero-logo{height:auto;width:clamp(144px,20.8vw,304px);opacity:0;animation:fadeup 1.6s .2s cubic-bezier(.2,.7,.2,1) forwards;margin-bottom:clamp(28px,5vh,60px)}
.hero h1{font-size:clamp(52px,9.6vw,190px);line-height:.9;letter-spacing:-.035em;word-spacing:.08em;text-transform:uppercase;font-weight:800}
.mask{display:block;overflow:hidden;padding-bottom:.06em}
.mask>span{display:block;transform:translateY(105%);animation:maskup 1.2s cubic-bezier(.2,.8,.2,1) forwards}
.mask:nth-child(1)>span{animation-delay:.9s}.mask:nth-child(2)>span{animation-delay:1.08s;color:var(--blue)}
@keyframes maskup{to{transform:none}}@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero-meta{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;margin-top:clamp(28px,5vh,56px);padding-top:22px;border-top:1px solid var(--line);align-items:start}
.hero-meta>*{opacity:0;animation:fadeup 1s forwards}
.hm1{grid-column:1/5;animation-delay:1.9s}.hm2{grid-column:5/10;animation-delay:2.15s;font:500 clamp(16px,1.5vw,21px)/1.6 var(--ko);color:var(--ice)}.hm3{grid-column:10/13;animation-delay:2.4s;text-align:right}
.hm1 .t{font:700 clamp(16px,1.6vw,22px)/1.3 var(--disp);letter-spacing:.02em;margin-top:8px}
.scrollhint{display:inline-flex;gap:10px;align-items:center;margin-top:10px}.scrollhint::after{content:"";width:1px;height:34px;background:var(--blue);animation:sh 2s infinite}

@media(max-width:860px){.hm1,.hm2,.hm3{grid-column:1/-1;text-align:left}.hero-meta{gap:16px}}


.hero h1{color:#fff}
.hero::after{display:none}
.hero::before{display:none}
/*HB*/.hero-bg{position:absolute;inset:0;z-index:-2;display:flex;align-items:center;justify-content:flex-end;overflow:hidden;background:radial-gradient(90% 90% at 80% 50%,#04215f 0%,#06122f 45%,#080B12 80%);perspective:1400px}
.hero-img{flex:none;width:max(75.6vw,134.4svh);aspect-ratio:1672/941;margin-right:-7vw;background:url(img/hero-bg.jpg) center/100% 100% no-repeat;filter:blur(34px) saturate(1.1);-webkit-mask-image:linear-gradient(transparent 0,#000 13%,#000 87%,transparent 100%),linear-gradient(90deg,transparent 0,#000 26%);-webkit-mask-composite:source-in;mask-image:linear-gradient(transparent 0,#000 13%,#000 87%,transparent 100%),linear-gradient(90deg,transparent 0,#000 26%);mask-composite:intersect;will-change:transform;opacity:0;animation:fadeup 2s .2s ease forwards}
.hero-gl{position:absolute;inset:0;z-index:-1;width:100%;height:100%;display:block;pointer-events:none;opacity:0;animation:fadeup 2s .6s ease forwards}
.hero-spot{position:absolute;inset:0;z-index:-2;pointer-events:none;opacity:0;background:radial-gradient(360px circle at var(--sx,70%) var(--sy,45%),rgba(70,170,255,.28),transparent 70%);mix-blend-mode:screen}
.hero-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(6,10,24,.72) 0%,rgba(6,10,24,.25) 48%,transparent 70%),linear-gradient(0deg,rgba(8,11,18,.85) 0%,transparent 28%)}
@media(max-width:860px){.hero-bg{align-items:flex-start;justify-content:flex-start}.hero-img{width:165vw;margin:28px 0 0 -58vw}.hero-shade{background:linear-gradient(0deg,rgba(8,11,18,.6) 0%,transparent 40%)}}
/* section head */
section{position:relative}
.sec{padding-block:clamp(84px,12vw,180px)}
.shead{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;align-items:end;margin-bottom:clamp(40px,6vw,88px)}

/* works (home) */
.wgrid{display:grid;grid-template-columns:repeat(12,1fr);column-gap:clamp(16px,2.4vw,40px);row-gap:clamp(48px,7vw,110px)}
.wk{display:block;min-width:0}

.w1{grid-column:1/8}.w2{grid-column:9/13;margin-top:18vw}.w3{grid-column:2/7}.w4{grid-column:7/13;margin-top:8vw}
.w5{grid-column:1/6}.w6{grid-column:6/13;margin-top:10vw}.w7{grid-column:1/8}.w8{grid-column:9/13;margin-top:10vw}

.more{display:flex;justify-content:center;margin-top:clamp(56px,8vw,120px)}
.btn{display:inline-flex;align-items:center;gap:14px;border:1px solid var(--line2);padding:20px 34px;font:600 13px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;position:relative;overflow:hidden;transition:border-color .3s,color .3s;background:none;border-radius:0}

.btn{z-index:0}.btn:hover::before{transform:none}.btn:hover{border-color:var(--blue);color:#fff}
.btn.solid{background:var(--blue);border-color:var(--blue);color:#fff}.btn.solid::before{background:#fff}.btn.solid:hover{color:var(--blue)}
.btn .ar{transition:transform .3s}.btn:hover .ar{transform:translateX(5px)}
/* clients */
.clients{background:var(--wbg);color:var(--wtx);padding-block:clamp(72px,10vw,150px);overflow:hidden}
.clients .lab{color:#6b7280}.clients .lab b{color:var(--blue)}
.clients h2{font-size:clamp(40px,7.6vw,128px);text-transform:uppercase;margin:20px 0 clamp(36px,5vw,72px);color:var(--wtx)}
.clients h2 em{font-style:normal;color:var(--blue)}
.mq{overflow:hidden;display:flex;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);padding-block:14px}

.mqt img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
@keyframes mql{to{transform:translateX(-100%)}}@keyframes mqr{from{transform:translateX(-100%)}to{transform:none}}

.cnote{margin-top:clamp(28px,4vw,52px);color:#6b7280;font-size:14px}

.about{isolation:isolate;overflow:hidden}
.about::before{content:"";position:absolute;left:0;right:0;top:0;height:min(100%,calc(100vw*0.72));z-index:-2;background:url(img/about-bg.jpg) center/cover no-repeat;opacity:.85;-webkit-mask-image:linear-gradient(transparent 0,#000 18%,#000 62%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 18%,#000 62%,transparent 100%)}

.about::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,11,18,.78),rgba(8,11,18,.3) 50%,rgba(8,11,18,.12));pointer-events:none}
.about .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(20px,3vw,48px)}
.ab-l{grid-column:1/6}.ab-r{grid-column:7/13}

form{display:grid;grid-template-columns:1fr 1fr;gap:22px 24px}

/* ===== archive ===== */
function archiveView(){
  const cnt=c=>c==='ALL'?P.length:P.filter(p=>p.cat===c).length;
  return `<div class="wrap"><div class="page-h"><span class="lab"><b>●</b> WORK ARCHIVE</span><h1 style="margin-top:20px">Work</h1><p>제안서부터 브랜딩까지, 다양한 목적에 맞춰 완성한 프로젝트를 간략히 소개합니다.<br>보다 자세한 작업 사례와 프로젝트 과정은 미팅을 통해 직접 소개해 드리겠습니다.</p></div>
  <div class="filters" role="group" aria-label="카테고리 필터">${['ALL',...CATS].map((c,i)=>`<button data-f="${esc(c)}" aria-pressed="${i==0}">${esc(c)}<sup>${cnt(c)}</sup></button>`).join('')}</div>
  <div class="agrid" id="ag">${P.map(p=>card(p)).join('')}</div></div>`;
}
function bindFilters(){
  const ag=$('#ag');if(!ag)return;
  $$('.filters button').forEach(b=>b.onclick=()=>{
    $$('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    const f=b.dataset.f,items=$$('.wk',ag);
    items.forEach(el=>el.classList.add('out'));
    setTimeout(()=>{items.forEach(el=>{const show=f==='ALL'||el.dataset.cat===f;el.hidden=!show;});
      requestAnimationFrame(()=>items.forEach(el=>{el.classList.add('in');el.classList.remove('out')}));},260);
  });
}

/* ===== lightbox ===== */
const lb=$('#lb'),lbi=$('#lbi');let lbk=0,lastF=null;
function lbShow(k){lbk=(k+shots.length)%shots.length;lbi.src=shots[lbk];lbi.alt=`이미지 ${lbk+1}/${shots.length}`;$('#lbc').textContent=`${String(lbk+1).padStart(2,'0')} / ${String(shots.length).padStart(2,'0')}`;lb.classList.remove('zoom');$('#lbs').scrollTo(0,0);
  $('#lbp').style.display=$('#lbn').style.display=shots.length>1?'':'none'}
function lbOpen(k){lastF=document.activeElement;lb.hidden=false;document.body.style.overflow='hidden';lbShow(k);$('#lbx').focus()}
function lbClose(){lb.hidden=true;document.body.style.overflow='';lastF&&lastF.focus&&lastF.focus()}
$('#lbx').onclick=lbClose;$('#lbp').onclick=()=>lbShow(lbk-1);$('#lbn').onclick=()=>lbShow(lbk+1);
const tz=()=>lb.classList.toggle('zoom');$('#lbz').onclick=tz;lbi.onclick=tz;
$('#lbs').onclick=e=>{if(e.target.id==='lbs'&&!lb.classList.contains('zoom'))lbClose()};
document.addEventListener('keydown',e=>{if(lb.hidden)return;if(e.key==='Escape')lbClose();if(e.key==='ArrowLeft')lbShow(lbk-1);if(e.key==='ArrowRight')lbShow(lbk+1)});

function bindForm(){
  const f=$('#cf');if(!f)return;
  const cm=$('#copymail');cm&&(cm.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(CONFIG.email).then(()=>{cm.textContent='COPIED'},()=>{})});
  const dm=$('#directmail');dm&&dm.addEventListener('click',e=>{if(!CONFIG.email){e.preventDefault();show('이메일 주소가 아직 설정되지 않았습니다. 아래 양식을 이용해 주세요.')}});
  const st=$('#cs');function show(t,ok,pre){st.hidden=false;st.className='status'+(ok?' ok':'');st.innerHTML=esc(t)+(pre?`<pre>${esc(pre)}</pre>`:'')}
  f.addEventListener('submit',async e=>{
    e.preventDefault();const d=Object.fromEntries(new FormData(f));let bad=false;
    const set=(k,m)=>{$(`.err[data-for=${k}]`,f).textContent=m||'';if(m)bad=true};
    set('name',d.name?.trim()?'':'이름을 입력해 주세요.');
    set('email',/^\S+@\S+\.\S+$/.test(d.email||'')?'':'올바른 이메일을 입력해 주세요.');
    set('message',d.message?.trim()?'':'프로젝트 내용을 입력해 주세요.');
    set('consent',d.consent?'':'개인정보 수집·이용에 동의해 주세요.');
    if(bad)return;
    const body=`[YPT 작업 문의]\n이름: ${d.name}\n회사: ${d.company||'-'}\n이메일: ${d.email}\n유형: ${d.type}\n희망 일정: ${d.timeline||'-'}\n\n${d.message}`;
    if(!CONFIG.endpoint){show('현재 문의 접수 서비스가 연결되어 있지 않아 전송되지 않았습니다. 아래 내용을 복사해 이메일로 보내주세요.',false,body);return}
    try{const r=await fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(d)});
      if(r.ok){show('문의가 접수되었습니다. 확인 후 회신드리겠습니다.',true);f.reset()}else throw 0}
    catch(_){show('전송에 실패했습니다. 잠시 후 다시 시도하거나 이메일로 문의해 주세요.',false,body)}
  });
}

  const mv=e=>{const b=hero.getBoundingClientRect();if(e.clientY<b.top||e.clientY>b.bottom)return;tx=e.clientX/innerWidth-.5;ty=(e.clientY-b.top)/b.height-.5;enT=1;last=performance.now();mx=e.clientX;my=e.clientY-b.top};
  addEventListener('pointermove',mv,{passive:true});
  function pose(){grp.rotation.set(-.18+y*1.1+Math.sin(ph*.5)*.1,.38+x*1.6+Math.sin(ph*.35)*.4,x*.3+Math.sin(ph*.4)*.05)}
  function frame(now){raf=requestAnimationFrame(frame);const dt=Math.min(.05,(now-tl)/1000);tl=now;if(document.hidden||scrollY>innerHeight)return;
    if(now-last>1200)enT=0;en+=(enT-en)*.06;x+=(tx-x)*.07;y+=(ty-y)*.07;ph+=dt*(.5+en*1.6);fp+=dt*(.8+en*5);
    if(r){pose();grp.rotation.y+=en*Math.sin(ph*1.3)*.5;grp.scale.setScalar(baseS*(1+.08*en));mat.uniforms.time.value=ph*2;mat.uniforms.flow.value=fp;r.render(sc,cam)}
    glow.style.transform=`translate3d(${-x*50}px,${-y*34}px,0) scale(${1+en*.05})`;
    sp.style.opacity=en*.8;sp.style.setProperty('--sx',mx+'px');sp.style.setProperty('--sy',my+'px')}
  if(reduce){if(r){pose();r.render(sc,cam)}}else raf=requestAnimationFrame(frame);
  heroStop=()=>{cancelAnimationFrame(raf);removeEventListener('pointermove',mv);removeEventListener('resize',size);if(r){g.dispose();mat.dispose();r.dispose()}};
}
/* ===== router ===== */
function reveal(){
  const els=$$('.rv:not(.in)');
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{rootMargin:'0px 0px -6% 0px',threshold:.05});
  els.forEach(e=>io.observe(e));
}
let cur='';
function route(){
  const h=(location.hash||'#home').slice(1);
  const secs=['about','experience','contact','clients','selected','home',''];
  let view,sec=null;
  if(h==='work')view='work';else if(h.startsWith('p-')&&BY[h.slice(2)])view=h;else{view='home';sec=h}
  document.title=view==='work'?'Work — YPT':view.startsWith('p-')?`${BY[view.slice(2)].title} — YPT`:'YPT Portfolio';
  if(view!==cur){
    cur=view;
    app.innerHTML=view==='home'?homeView():view==='work'?archiveView():detailView(BY[view.slice(2)]);
    if(view==='work')bindFilters();
    if(view==='home'){bindForm();initHero()}else if(heroStop){heroStop();heroStop=null}
    $$('.shot').forEach(b=>b.onclick=()=>lbOpen(+b.dataset.k));
    window.scrollTo(0,0);reveal();
  }
  if(view==='home'&&sec&&sec!=='home'){const el=document.getElementById(sec);el&&setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),50)}
  else if(view==='home')window.scrollTo(0,0);
  $$('nav.main a').forEach(a=>a.classList.toggle('on',a.dataset.nav===(view==='work'||view.startsWith('p-')?'work':sec)));
  closeMenu();
}
window.addEventListener('hashchange',route);
const burger=$('.burger'),nav=$('#nav');
function closeMenu(){nav.classList.remove('open');burger.setAttribute('aria-expanded','false');document.body.style.overflow=lb.hidden?'':'hidden'}
burger.onclick=()=>{const o=nav.classList.toggle('open');burger.setAttribute('aria-expanded',o);document.body.style.overflow=o?'hidden':''};
window.addEventListener('scroll',()=>$('#top').classList.toggle('sc',scrollY>40),{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&nav.classList.contains('open'))closeMenu()});
route();
</script>
